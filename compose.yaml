services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:////app/data/job_applications.db
    volumes:
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: python -m scripts.refresh
    environment:
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - LLM_MODEL=${LLM_MODEL:-openai:gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

volumes:
  db_data:
