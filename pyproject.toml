[project]
name = "job-application-tracker"
version = "0.1.0"
description = "FastAPI backend for managing job applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "anyio[trio]>=4.0.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
